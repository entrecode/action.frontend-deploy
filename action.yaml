name: Frontend deploy action
description: 'downloads artifact and deploys to AWS s3'

inputs:
  AWS_ACCESS_KEY_ID:
    description: 'AWS_ACCESS_KEY_ID secret'
    required: true
  AWS_SECRET_ACCESS_KEY:
    description: 'AWS_SECRET_ACCESS_KEY secret'
    required: true
  bucket_name:
    description: 'build.outputs.bucket_name'
    required: true
  USE_S3_ROOT_FOLDER:
    description: 'when true the build output will be deployed to the root folder of the s3 bucket identified by bucket_name, otherwise the build output will be deployed to the folder identified by bucket_name into ec-admins bucket'
    required: false
    default: 'false'
  SLACK_TOKEN:
    description: 'slack token'
    required: false
    default: ''
  SLACK_CHANNEL:
    description: 'slack channel'
    required: false
    default: ''
  version:
    description: 'version of build output'
    required: false
    default: ''
  DSB_LAYER_AUTH_PASSWORD:
    description: 'password for authentication (dsb-layer)'
    required: false
    default: ''
  CLOUDFRONT_DISTRIBUTION_ID:
    description: 'CloudFront distribution ID to invalidate when USE_S3_ROOT_FOLDER is true'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: build_result

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Deploy to AWS
      run: |
        aws configure set default.s3.max_concurrent_requests 50
        if [[ "${{ inputs.USE_S3_ROOT_FOLDER }}" == "true" ]]; then
          S3_BUCKET_PATH="s3://${{ inputs.bucket_name }}"
        else
          S3_BUCKET_PATH="s3://ec-admins/${{ inputs.bucket_name }}"
        fi
        aws s3 rm $S3_BUCKET_PATH --recursive  
        aws s3 sync ./ $S3_BUCKET_PATH --cache-control max-age=31536000 --exclude "index.html" --exclude "OidcTrustedDomains.*"
        aws s3 sync ./ $S3_BUCKET_PATH --cache-control max-age=0 --exclude "*" --include "index.html" --include "OidcTrustedDomains.*"
      shell: bash

    - name: Invalidate CloudFront distribution
      if: inputs.USE_S3_ROOT_FOLDER == 'true' && inputs.CLOUDFRONT_DISTRIBUTION_ID != ''
      uses: chetan/invalidate-cloudfront-action@v2
      with:
        DISTRIBUTION: ${{ inputs.CLOUDFRONT_DISTRIBUTION_ID }}
        PATHS: "/*"
        AWS_REGION: "eu-central-1"
        AWS_ACCESS_KEY_ID: ${{ inputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.AWS_SECRET_ACCESS_KEY }}

    - name: check if bucket_name is prod
      if: inputs.SLACK_TOKEN != '' && inputs.SLACK_CHANNEL != ''
      id: check-bucket_name-tag
      run: |
        if [[ ${{ inputs.bucket_name }} == *-prod ]]; then
          echo "match=true" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: trim bucket_name
      if: steps.check-bucket_name-tag.outputs.match == 'true'
      run: |
        app_name_trimmed=$(echo ${{ inputs.bucket_name }} | awk -F '-' '{OFS="-"; $NF=""; print $0}' | sed 's/-$//')
        echo "APP_NAME=$app_name_trimmed" >> $GITHUB_ENV
      shell: bash

    - name: Hector slack Notifications
      if: steps.check-bucket_name-tag.outputs.match == 'true' && inputs.SLACK_TOKEN != '' && inputs.SLACK_CHANNEL != ''
      uses: slackapi/slack-github-action@v2
      with:
        method: chat.postMessage
        token: ${{ inputs.SLACK_TOKEN }}
        payload: |
          channel: ${{ inputs.SLACK_CHANNEL }}
          attachments:
            - color: "28a745"
              fields:
                - value: "Neue Version von  ${{ env.APP_NAME }} ausgerollt"
